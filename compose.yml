services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: letterdock
      POSTGRES_USER: letterdock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U letterdock"]
      interval: 3s
      timeout: 2s
      retries: 15
    restart: unless-stopped
  app:
    build: .
    env_file: .env
    environment:
      APP_PORT: ${APP_PORT:-3000}
      PORT: 3000
      DATABASE_URL: postgres://letterdock:${POSTGRES_PASSWORD}@db:5432/letterdock
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
volumes:
  database:
  app_data: