# Letterdock + Tailscale Sidecar Container Overlay
# Usage:
#   docker compose -f compose.yml -f compose.tailscale.yml up -d
#
# Prerequisites in .env:
#   TS_AUTHKEY=tskey-auth-...        # Generate in Tailscale Admin Console -> Settings -> Keys
#   TS_HOSTNAME=letterdock           # Tailnet machine name
#   TS_STATE_DIR=/var/lib/tailscale

services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: ${TS_HOSTNAME:-letterdock}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:?Set TS_AUTHKEY for Tailscale sidecar}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--advertise-tags=tag:server
      - TS_USERSPACE=false
    volumes:
      - tailscale_data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: unless-stopped

  app:
    # Route app traffic through tailscale container network
    network_mode: "service:tailscale"
    depends_on:
      tailscale:
        condition: service_started
      db:
        condition: service_healthy

volumes:
  tailscale_data:
